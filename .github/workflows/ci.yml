name: Verify EdgeOne build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - name: Build and enforce asset budgets
        run: npm run build:edgeone

  e2e:
    # PNG 基线在 Windows Chromium 生成；固定同一 OS，避免字体栅格化差异被误报为视觉回归。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      # E2E 前必须重新构建,不依赖本地遗留 dist
      - run: npm run build:edgeone
      - run: npm run test:e2e

  server-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run check:server
      - run: npm run test:server
