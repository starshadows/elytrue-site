name: Verify EdgeOne build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build:edgeone

  e2e:
    # PNG 基线在 Windows Chromium 生成；固定同一 OS，避免字体栅格化差异被误报为视觉回归。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      # E2E 前必须重新构建,不依赖本地遗留 dist
      - run: npm run build:edgeone
      - run: npm run test:e2e

  server-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run check:server
      - run: npm run test:server
